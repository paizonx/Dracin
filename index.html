<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
}

.container {
    max-width:500px;
    margin:auto;
}

video {
    width:100%;
    background:#000;
}

.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    font-size:18px;
    cursor:pointer;
}

.progress {
    height:5px;
    background:#222;
}

.bar {
    height:5px;
    width:0%;
    background:#ff2e63;
}

.info {
    padding:10px;
    font-size:14px;
    color:#aaa;
}

.next {
    padding:10px;
    border-top:1px solid #222;
}

.next-item {
    display:flex;
    gap:10px;
    margin-top:10px;
    cursor:pointer;
}

.next-item img {
    width:100px;
    border-radius:6px;
}
</style>

<script>
let started = false;

// ambil ID dari URL
function getId(){
    const params = new URLSearchParams(window.location.search);
    return params.get("v") || "demo";
}

// load video dinamis
function loadVideo(){
    let id = getId();

    // 🔥 GANTI DENGAN CDN LO
    let videoUrl = "https://cdn2.videy.co/video/" + id + ".mp4";

    let video = document.getElementById("video");
    video.src = videoUrl;

    // fallback kalau error
    video.onerror = function(){
        video.src = "https://cdn2.videy.co/video/default.mp4";
    }
}

// klik pertama user
function startVideo(){
    if(started) return;
    started = true;

    document.getElementById("overlay").style.display = "none";

    // 🔥 TRIGGER IKLAN (GANTI LINK LO)
    window.open("https://your-adsterra-link.com","_blank");

    startProgress();
}

// progress bar jalan
function startProgress(){
    let bar = document.getElementById("bar");
    let width = 0;

    let interval = setInterval(()=>{
        width += 0.4;
        bar.style.width = width + "%";

        if(width >= 100){
            clearInterval(interval);
        }
    },200);
}

// fake viewers (biar hidup)
function fakeViewers(){
    let el = document.getElementById("viewers");
    let base = 15000;

    setInterval(()=>{
        let rand = Math.floor(Math.random()*800);
        el.innerText = (base + rand).toLocaleString();
    },2000);
}

// next video random
function goNext(){
    let vids = ["a1","b2","c3","d4"];
    let pick = vids[Math.floor(Math.random()*vids.length)];
    window.location.href = "main.html?v=" + pick;
}

window.onload = function(){
    loadVideo();
    fakeViewers();
}
</script>

</head>

<body>

<div class="container">

<div style="position:relative">

<video id="video" autoplay muted loop playsinline></video>

<div id="overlay" class="overlay" onclick="startVideo()">
Tap for sound 🔊
</div>

</div>

<div class="progress">
    <div id="bar" class="bar"></div>
</div>

<div class="info">
👁️ <span id="viewers">18,421</span> watching now
</div>

<div class="next">
<b>Up next</b>

<div class="next-item" onclick="goNext()">
<img src="https://via.placeholder.com/120x80">
<div>Recommended video</div>
</div>

<div class="next-item" onclick="goNext()">
<img src="https://via.placeholder.com/120x80">
<div>You may also like</div>
</div>

</div>

</div>

</body>
</html>
